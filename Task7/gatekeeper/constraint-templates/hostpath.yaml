apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: hostpath
spec:
  crd:
    spec:
      names:
        kind: HostPath
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package hostpath
        violation[{"msg": msg}] {
          volume := input.review.object.spec.volumes[_]
          volume.hostPath
          msg := sprintf("HostPath volume '%v' is forbidden", [volume.name])
        }