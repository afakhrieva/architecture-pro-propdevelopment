apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-devops
rules:
  - apiGroups: ["", "apps", "networking.k8s.io", "extensions"]
    resources: ["deployments", "services", "ingresses", "configmaps", "pods", "replicasets", "statefulsets", "jobs", "cronjobs"]
    verbs: ["create", "update", "patch", "delete", "get", "list", "watch"]